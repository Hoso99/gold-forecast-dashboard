name: V9.5 Oracle Paper Monitor Checks
on:
  push:
    branches: [research/v94-reliability-audit-20261011]
    paths:
      - 'research/active_position_monitor/v95_paper_monitor.py'
      - 'research/active_position_monitor/test_v95_paper_monitor.py'
      - '.github/workflows/v95-oracle-paper-checks.yml'
  workflow_dispatch:
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile and test paper monitor without network or credentials
        run: |
          python -m py_compile research/active_position_monitor/v95_paper_monitor.py
          python -m unittest discover -s research/active_position_monitor -p 'test_v95_paper_monitor.py' -v
