name: V9.5 Historical M1 Backfill Sep 07-08
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v95-historical-backfill-pilot
  cancel-in-progress: false
jobs:
  backfill:
    runs-on: [self-hosted, Linux, X64, v95-research-only]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/v95-m5-exit-challenger-20261015
          persist-credentials: false
      - name: Backfill Sep 7-8 private M1 and analyze episodes
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          PYTHONPATH: ${{ github.workspace }}
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 research/active_position_monitor/v95_historical_m1_backfill_sep07_08.py
