name: V9.4 Stage 1 Spot Pressure Monitor (Research Only)
on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
permissions:
  contents: read
concurrency:
  group: v94-stage1-spot-pressure
  cancel-in-progress: false
jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Observe spot XAUUSD pressure (no trading or alerts)
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        run: python research/active_position_monitor/stage1_monitor.py
      - name: Upload pressure snapshot
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: v94-stage1-pressure-${{ github.run_id }}
          path: research/active_position_monitor/pressure_snapshot.csv
          retention-days: 30
