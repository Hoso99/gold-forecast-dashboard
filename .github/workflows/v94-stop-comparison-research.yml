name: V9.4 Stop Options Comparison (Research Only)

on:
  workflow_dispatch:
  schedule:
    - cron: '25 */3 * * *'

permissions:
  contents: read
  actions: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout research files
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install pandas numpy
      - name: Download latest forward M1 collector artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: python research/v94_stop_comparison/download_latest_collector.py
      - name: Run four-way comparison (research only)
        run: |
          cd research/v94_stop_comparison
          python compare_stop_options.py --input v94_forward_m1.csv --output comparison_output
          python forward_progress.py
          python sell_opportunity_tracker.py
      - name: Upload comparison CSVs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v94-stop-comparison-${{ github.run_id }}
          path: research/v94_stop_comparison/comparison_output/*.csv
          if-no-files-found: warn
          retention-days: 30
