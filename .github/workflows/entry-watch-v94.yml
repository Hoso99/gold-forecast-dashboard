name: V9.4 Entry Watch

on:
  workflow_dispatch:
  schedule:
    # Run shortly after each 15-minute candle boundary.
    - cron: "2,17,32,47 * * * *"

permissions:
  contents: write

concurrency:
  group: v94-entry-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Synchronize with latest main
        run: |
          git fetch origin main
          git reset --hard origin/main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install numpy pandas scikit-learn requests

      - name: Recalculate and check V9.4 entry threshold
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python entry_watch_v94.py

      - name: Persist watcher and evidence state
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Stage ALL V9.4 files that the watcher is allowed to update BEFORE
          # attempting any rebase. This prevents "unstaged changes" failures.
          git add -- entry_watch_v94.json trade_journal_v94.json evidence_journal_v94.json

          if git diff --cached --quiet; then
            echo "No V9.4 watcher/evidence changes to persist."
            exit 0
          fi

          git commit -m "Update V9.4 watcher and evidence state"

          # The working tree is now clean, so rebasing is safe if main advanced
          # while this workflow was running.
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
