name: C2 Raw Replay Provenance Audit
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: c2-raw-provenance
  cancel-in-progress: false
jobs:
  audit:
    runs-on: [self-hosted, Linux, X64, v95-research-only]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/v95-adaptive-exit-challenger-20261018
          persist-credentials: false
      - name: Audit frozen C2 report and source candidates
        run: python3 research/historical/c2_raw_replay_provenance.py
      - uses: actions/upload-artifact@v4
        with:
          name: c2-raw-replay-provenance-${{ github.run_id }}
          path: c2-raw-replay-provenance.json
          retention-days: 14
