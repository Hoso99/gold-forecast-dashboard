name: V9.4 Candle Window Comparison

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v94-candle-window-comparison
  cancel-in-progress: false

jobs:
  compare:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Synchronize with latest main
        run: |
          git fetch origin main
          git reset --hard origin/main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install numpy pandas scikit-learn requests

      - name: Run candle window comparison
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        run: python compare_candle_windows_v94.py

      - name: Persist comparison results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add candle_window_comparison_v94.csv candle_window_summary_v94.csv

          if git diff --cached --quiet; then
            echo "No comparison result changes to persist."
          else
            git commit -m "Update V9.4 candle window comparison"

            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
