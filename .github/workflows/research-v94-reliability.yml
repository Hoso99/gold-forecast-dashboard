name: Research V9.4 Reliability Tests

on:
  push:
    branches:
      - research/v94-reliability-audit-20261011
    paths:
      - entry_watch_v94.py
      - research/audits/**
      - .github/workflows/research-v94-reliability.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install offline replay dependencies
        run: python -m pip install pandas numpy
      - name: Check Python syntax
        run: python -m py_compile entry_watch_v94.py research/audits/test_v94_reliability.py research/audits/replay_structure_v94.py research/audits/test_v94_replay.py
      - name: Run static regression tests (no API keys or orders)
        run: python -m unittest discover -s research/audits -p 'test_v94_*.py' -v
      - name: Inspect historical data schema (research only)
        run: |
          python - <<'PY'
          import csv, json
          from pathlib import Path
          root = Path(".")
          trades = json.loads((root / "trade_journal_v94.json").read_text())
          sells = [t for t in trades if t.get("side") == "SELL"]
          print("SELL records:", len(sells))
          print("Original ATR multiple recorded:", sum(t.get("atr_multiple") is not None for t in sells))
          for name in ("candle_dynamics_m15_v94.csv", "candle_window_comparison_v94.csv"):
              with (root / name).open(newline="", encoding="utf-8-sig") as stream:
                  reader = csv.DictReader(stream)
                  print(name, "columns:", reader.fieldnames)
                  for row in reader:
                      print("First row:", row)
                      break
          PY
      - name: Run V9.5 exploratory SELL challenger (offline only)
        run: python research/audits/v95_sell_challenger.py --output /tmp/v95_sell_challenger.json
      - name: Compare V9.5 bearish continuation and rejection features
        run: python research/audits/v95_sell_features.py
      - name: Inventory point-in-time SELL and higher-timeframe features
        run: python research/audits/v95_feature_inventory.py
      - name: Compare V9.5 higher-timeframe SELL context (descriptive only)
        run: python research/audits/v95_context_comparison.py
