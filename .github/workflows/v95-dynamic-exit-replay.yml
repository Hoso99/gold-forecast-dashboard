name: V9.5 Dynamic SELL Exit Historical Replay

on:
  push:
    branches:
      - research/v94-reliability-audit-20261011
    paths:
      - research/audits/v95_dynamic_exit_replay.py
      - .github/workflows/v95-dynamic-exit-replay.yml
      - research/audits/v95_exit_promotion_gate.py

permissions:
  contents: read

jobs:
  offline-replay:
    if: github.ref == 'refs/heads/research/v94-reliability-audit-20261011'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install research dependencies
        run: python -m pip install numpy pandas
      - name: Replay fixed 2R vs dynamic exits (no trading)
        run: |
          mkdir -p research-reports
          python research/audits/v95_dynamic_exit_replay.py > research-reports/v95_dynamic_exit_replay.json
          python -m json.tool research-reports/v95_dynamic_exit_replay.json
      - name: Evaluate research-only promotion gate
        run: python research/audits/v95_exit_promotion_gate.py > research-reports/v95_exit_promotion_gate.json
      - name: Upload research replay report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v95-dynamic-exit-replay
          path: research-reports/
          if-no-files-found: warn
          retention-days: 14
