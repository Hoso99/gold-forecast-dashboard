name: V9.5 Historical Exit Gap Audit
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: v95-historical-exit-gap-audit
  cancel-in-progress: false
jobs:
  audit:
    runs-on: [self-hosted, Linux, X64, v95-research-only]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/v95-adaptive-exit-challenger-20261018
          persist-credentials: false
      - name: Download previous adaptive challenger report
        uses: actions/download-artifact@v4
        with:
          name: v95-adaptive-exit-challenger-39128223687
          run-id: 39128223687
          repository: Hoso99/gold-forecast-dashboard
          github-token: ${{ github.token }}
          path: previous-results
      - name: Check input and audit code
        run: |
          test -f previous-results/v95-adaptive-exit-challenger.json
          python3 -m py_compile research/historical/v95_exit_gap_audit.py
      - name: Audit unresolved episodes against read-only Oracle M1 candles
        run: |
          python3 research/historical/v95_exit_gap_audit.py --report previous-results/v95-adaptive-exit-challenger.json --output v95-exit-gap-audit.json
      - name: Upload gap audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v95-exit-gap-audit-${{ github.run_id }}
          path: v95-exit-gap-audit.json
          if-no-files-found: warn
          retention-days: 14
