name: V9.5 Recovery Research Tests
on:
  pull_request:
    paths:
      - 'research/feed_validation/v95_candle_gap_audit.py'
      - 'research/feed_validation/test_v95_candle_gap_audit.py'
      - 'research/feed_validation/v95_recovery_dry_run.py'
      - 'research/feed_validation/test_v95_recovery_dry_run.py'
      - 'research/feed_validation/v95_gap_aware_gate.py'
      - 'research/feed_validation/test_v95_gap_aware_gate.py'
      - 'research/active_position_monitor/v95_paper_monitor.py'
      - 'research/active_position_monitor/test_v95_paper_monitor.py'
      - '.github/workflows/v95-recovery-research-tests.yml'
      - 'research/feed_validation/v95_reconnect_timing_sim.py'
      - 'research/feed_validation/test_v95_reconnect_timing_sim.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline gap and candidate tests
        run: python -m unittest discover -s research/feed_validation -p 'test_v95_*.py' -v
      - name: Paper monitor offline safeguards
        run: python -m unittest discover -s research/active_position_monitor -p 'test_v95_*.py' -v
      - name: Syntax check
        run: python -m py_compile research/feed_validation/v95_candle_gap_audit.py research/feed_validation/v95_recovery_dry_run.py research/feed_validation/v95_gap_aware_gate.py research/active_position_monitor/v95_paper_monitor.py

  oracle-read-only-inspection:
    # No checkout, no credentials, no network calls, no writes.
    # Only the same-repository, named V9.5 research PR may schedule Oracle work.
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == 'Hoso99/gold-forecast-dashboard' && github.event.pull_request.head.ref == 'research/v95-candle-recovery-20261014' && github.event.pull_request.base.ref == 'research/v95-detector-implementation' }}
    runs-on: [self-hosted, Linux, X64, v95-research-only]
    timeout-minutes: 3
    steps:
      - name: Read-only local Biquote collector metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import ast
          from pathlib import Path
          path = Path("/home/ubuntu/v95-detector-dev/research/feed_validation/biquote_m1_collector.py")
          print("COLLECTOR_EXISTS", path.is_file())
          if not path.is_file():
              print("COLLECTOR_UNREADABLE_FROM_RUNNER")
              raise SystemExit(0)
          tree = ast.parse(path.read_text(encoding="utf-8"))
          for node in tree.body:
              if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef)):
                  print("FUNCTION", node.name, "PARAMETER_COUNT", len(node.args.args))
          modules = set()
          for node in ast.walk(tree):
              if isinstance(node, ast.Import):
                  modules.update(a.name.split(".")[0] for a in node.names)
              elif isinstance(node, ast.ImportFrom) and node.module:
                  modules.add(node.module.split(".")[0])
          for name in sorted(modules):
              print("IMPORT_MODULE", name)
          print("READ_ONLY_INSPECTION_COMPLETE")
          print("RECOVERY_STRUCTURE_BEGIN")
          for node in ast.walk(tree):
              if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef)):
                  calls = []
                  for sub in ast.walk(node):
                      if isinstance(sub, ast.Call):
                          func = sub.func
                          if isinstance(func, ast.Name):
                              name = func.id
                          elif isinstance(func, ast.Attribute):
                              name = func.attr
                          else:
                              continue
                          if name in {"create_connection", "WebSocketApp", "run_forever", "recv", "send", "close", "sleep", "connect", "execute", "commit", "save_candle", "readiness", "collect", "connect_db", "settimeout"}:
                              calls.append(name)
                  handlers = []
                  for sub in ast.walk(node):
                      if isinstance(sub, ast.ExceptHandler):
                          typ = sub.type
                          if isinstance(typ, ast.Name):
                              handlers.append(typ.id)
                          elif isinstance(typ, ast.Tuple):
                              handlers.append("MULTIPLE")
                          elif typ is None:
                              handlers.append("BARE")
                          else:
                              handlers.append("OTHER")
                  counts = {kind: sum(isinstance(x, kind) for x in ast.walk(node)) for kind in (ast.While, ast.For, ast.Try, ast.If, ast.With)}
                  print("FUNCTION_RECOVERY", node.name, "CALLS", ",".join(sorted(set(calls))), "EXCEPT", ",".join(handlers), "WHILE", counts[ast.While], "FOR", counts[ast.For], "TRY", counts[ast.Try], "IF", counts[ast.If], "WITH", counts[ast.With])
          print("RECOVERY_STRUCTURE_END")
          # Describe protocol syntax without printing any source constants, credentials or payload values.
          for fn in tree.body:
              if not isinstance(fn, (ast.FunctionDef, ast.AsyncFunctionDef)) or fn.name != "collect":
                  continue
              for node in ast.walk(fn):
                  if isinstance(node, ast.Call):
                      target = node.func
                      callname = target.id if isinstance(target, ast.Name) else target.attr if isinstance(target, ast.Attribute) else "unknown"
                      if callname in {"create_connection", "send", "recv", "json", "loads", "get", "split", "sleep", "save_candle", "readiness"}:
                          args = [type(a).__name__ for a in node.args]
                          print("PROTOCOL_CALL", callname, "ARG_TYPES", ",".join(args), "LINE", node.lineno)
                  elif isinstance(node, ast.Subscript):
                      if isinstance(node.value, ast.Name):
                          print("PROTOCOL_SUBSCRIPT", node.value.id, "KEY_TYPE", type(node.slice).__name__, "LINE", node.lineno)
                  elif isinstance(node, ast.Compare):
                      print("PROTOCOL_COMPARE", ",".join(type(op).__name__ for op in node.ops), "LINE", node.lineno)
          print("PROTOCOL_SHAPE_COMPLETE")
          PY

  oracle-isolated-builder-smoke:
    # Research-only checkout in runner workspace; no systemd or live DB access.
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == 'Hoso99/gold-forecast-dashboard' && github.event.pull_request.head.ref == 'research/v95-candle-recovery-20261014' && github.event.pull_request.base.ref == 'research/v95-detector-implementation' }}
    runs-on: [self-hosted, Linux, X64, v95-research-only]
    timeout-minutes: 3
    steps:
      - name: Checkout approved research branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate isolated candle builder on Oracle
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s research/feed_validation -p 'test_v95_independent_candle_builder.py' -v
          python3 -m unittest discover -s research/feed_validation -p 'test_v95_reconnect_timing_sim.py' -v
          python3 -m py_compile research/feed_validation/v95_independent_candle_builder.py
          echo ORACLE_RESEARCH_BUILDER_SMOKE_OK
